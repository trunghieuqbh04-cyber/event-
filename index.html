<style>
  /* Layout: full-bleed walkable 3D venue; brand chip top-left, language top-right, control dock along the bottom.
     One deliberate dark look (a venue at night), coloured from the logo: navy ground, signal orange accent. */
  :root {
    --bg: #050d24;
    --navy: #00308a;
    --panel: rgba(6, 18, 52, 0.78);
    --line: rgba(160, 190, 255, 0.2);
    --fg: #f3f6ff;
    --muted: #9fb0d6;
    --accent: #f45120;
    --display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .brand {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; gap: 10px; align-items: center; pointer-events: none; z-index: 5;
  }
  .brand img { width: 40px; height: 40px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.45); }
  .brand b { display: block; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .01em; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }

  .topright {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 8px; align-items: center; z-index: 6;
  }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(6px); }
  .seg button { border: 0; background: transparent; padding: 6px 11px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  button {
    font: 600 13px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(6px); white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button kbd {
    font: 700 10.5px/1 var(--body); background: rgba(255,255,255,.14); border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 5px; margin-right: 7px; min-width: 14px; display: inline-block; text-align: center; vertical-align: 1px;
  }
  button[aria-pressed="true"] kbd { background: rgba(255,255,255,.25); border-color: rgba(255,255,255,.35); }
  body.touch button kbd { display: none; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .icon-btn { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; font-size: 15px; }

  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between;
    background: linear-gradient(to top, rgba(5,13,36,.92), rgba(5,13,36,.5) 70%, transparent);
  }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-right: 2px; }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%,-50%); pointer-events: none; z-index: 4; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.85); mix-blend-mode: difference; }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }

  #toast {
    position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 6;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600;
    pointer-events: none; transition: opacity .25s; opacity: 0;
  }
  #toast.on { opacity: 1; }

  /* start / pause card */
  #intro {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px;
    background: radial-gradient(ellipse at center, rgba(0,48,138,.55), rgba(5,13,36,.9) 70%);
  }
  .card {
    width: min(460px, 100%); background: rgba(6, 18, 52, 0.9); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px 22px 20px; display: grid; gap: 14px; max-height: 100%; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card header { display: flex; gap: 12px; align-items: center; }
  .card header img { width: 52px; height: 52px; border-radius: 12px; }
  .card h1 { font-family: var(--display); font-size: 24px; margin: 0; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; font-size: 13.5px; }
  .keys kbd {
    font: 600 12px/1 var(--body); background: rgba(255,255,255,.08); border: 1px solid var(--line); border-bottom-width: 3px;
    border-radius: 6px; padding: 5px 7px; display: inline-block; min-width: 26px; text-align: center; margin-right: 3px;
  }
  .card .go { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 15px; padding: 13px 18px; justify-self: stretch; }
  #loadwrap { display: grid; gap: 8px; }
  .bar { height: 5px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--navy), var(--accent)); transition: width .2s; }
  #loadnote { font-size: 12.5px; color: var(--muted); }

  .namefield { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .namefield input {
    font: 500 14px/1 var(--body); color: var(--fg); background: rgba(255,255,255,.07); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; user-select: text; -webkit-user-select: text;
  }
  .namefield input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #online {
    position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); z-index: 5;
    font-size: 12px; font-weight: 600; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
    pointer-events: none; backdrop-filter: blur(6px);
  }
  #online::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; margin-right: 7px; vertical-align: 1px; }

  /* touch controls */
  #touch { display: none; }
  body.touch #touch { display: block; }
  body.touch .desk-only { display: none !important; }
  body:not(.touch) .touch-only { display: none !important; }
  #joy {
    position: fixed; z-index: 5; left: max(24px, calc(env(safe-area-inset-left, 0px) + 16px)); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    width: 124px; height: 124px; border-radius: 50%; background: rgba(6,18,52,.45); border: 1px solid var(--line); touch-action: none;
  }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(244,81,32,.85); box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .tbtns { position: fixed; z-index: 5; right: max(24px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; justify-items: end; }
  .tbtns button { width: 64px; height: 64px; border-radius: 50%; padding: 0; font-size: 12px; touch-action: none; }
  .tbtns .big { width: 78px; height: 78px; font-size: 13px; background: rgba(244,81,32,.85); border-color: var(--accent); }
  body.touch .dock { justify-content: flex-start; }
  body.touch .dock .group { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }

  @media (max-width: 560px) {
    .brand small { display: none; }
    .brand b { font-size: 16px; }
    .dock .label { display: none; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { MeshBVH, acceleratedRaycast } from 'three-mesh-bvh';

/* ================= i18n ================= */
const T = {
  en: {
    tag: 'Venue concept preview', go: 'Go to', z_entry: 'Entrance', z_checkin: 'Check-in', z_hall: 'Main hall', z_stage: 'Stage', z_razer: 'Razer zone',
    view: 'View', v0: 'First person', v1: 'Third person', v2: 'Front view', fly: 'Fly', light: 'Lighting',
    night: 'Night mode', beams: 'Moving heads', blink: 'Blink', jump: 'Jump', run: 'Run',
    intro: 'Walk through the event venue concept as a character, like a block game.',
    k_move: 'Walk', k_jump: 'Jump (fly up when flying)', k_run: 'Run (fly down when flying)', k_look: 'Look around',
    k_view: 'Switch view: first, third, front', k_fly: 'Fly mode on/off', k_esc: 'Pause and show the cursor',
    yourname: 'Your name (shown above your avatar)', online: 'online',
    k_zones: 'Jump to: entrance, check-in, hall, stage, Razer', k_light: 'Toggle night mode, moving heads, blink',
    t_move: 'Left stick to walk', t_look: 'Drag anywhere else to look around', t_jump: 'Buttons on the right to jump and run',
    loading: 'Loading the venue', building: 'Preparing walls and floor…', start: 'Start exploring', resume: 'Resume',
    err: 'The venue could not load. Check your connection and refresh the page.', flyOn: 'Fly mode on', flyOff: 'Fly mode off',
  },
  vi: {
    tag: 'Bản thiết kế ý tưởng sự kiện', go: 'Đi tới', z_entry: 'Lối vào', z_checkin: 'Check-in', z_hall: 'Sảnh chính', z_stage: 'Sân khấu', z_razer: 'Khu Razer',
    view: 'Góc nhìn', v0: 'Ngôi thứ nhất', v1: 'Ngôi thứ ba', v2: 'Nhìn trước mặt', fly: 'Bay', light: 'Ánh sáng',
    night: 'Chế độ tối', beams: 'Đèn quét', blink: 'Nhấp nháy', jump: 'Nhảy', run: 'Chạy',
    intro: 'Điều khiển nhân vật đi dạo quanh bản thiết kế sự kiện, như trong game khối vuông.',
    k_move: 'Di chuyển', k_jump: 'Nhảy (bay lên khi đang bay)', k_run: 'Chạy nhanh (bay xuống khi đang bay)', k_look: 'Xoay góc nhìn',
    k_view: 'Đổi góc nhìn: thứ nhất, thứ ba, phía trước', k_fly: 'Bật/tắt chế độ bay', k_esc: 'Tạm dừng, hiện con trỏ',
    yourname: 'Tên của bạn (hiện trên đầu nhân vật)', online: 'đang online',
    k_zones: 'Đi tới: lối vào, check-in, sảnh, sân khấu, Razer', k_light: 'Bật/tắt chế độ tối, đèn quét, nhấp nháy',
    t_move: 'Cần trái để di chuyển', t_look: 'Vuốt chỗ khác trên màn hình để xoay', t_jump: 'Nút bên phải để nhảy và chạy',
    loading: 'Đang tải sảnh sự kiện', building: 'Đang dựng tường và sàn…', start: 'Bắt đầu khám phá', resume: 'Tiếp tục',
    err: 'Không tải được sảnh. Kiểm tra kết nối mạng rồi tải lại trang.', flyOn: 'Đã bật chế độ bay', flyOff: 'Đã tắt chế độ bay',
  },
};
// English by default; the EN/VIE switch is remembered per browser.
let lang = 'en';
try { lang = localStorage.getItem('demoEventLang') || 'en'; } catch {}
const t = (k) => (T[lang] && T[lang][k]) || T.en[k] || k;
let loadState = 'loading';
function applyLang() {
  document.documentElement.lang = lang === 'vi' ? 'vi' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.getElementById('tViewLbl').textContent = t('v' + viewMode);
  const go = document.getElementById('goBtn');
  go.textContent = loadState === 'ready' ? (started ? t('resume') : t('start')) : t('loading') + '…';
  const note = document.getElementById('loadnote');
  note.textContent = loadState === 'error' ? t('err') : loadState === 'build' ? t('building') : loadState === 'ready' ? '' : t('loading') + ' · 4.5 MB';
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', (e) => {
  e.stopPropagation(); lang = b.dataset.lang; try { localStorage.setItem('demoEventLang', lang); } catch {} applyLang();
}));

/* ================= renderer / scene ================= */
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const host = document.getElementById('stage');
// No logarithmic depth buffer: it makes polygonOffset a no-op, so coplanar decals could not be fixed. The hall is small, so a normal 24-bit depth buffer is plenty.
// Rendered straight to the canvas with native MSAA. The EffectComposer + bloom chain drew only a strip of the frame on some GPUs, so it was removed.
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 1.6));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(0x050d24);
const hemi = new THREE.HemisphereLight(0xf2f4ff, 0x1a1830, 0.4);
scene.add(hemi);
// warm house lights along the hall so night mode still reads
const houseLights = [];
for (const z of [28, 18, 8]) {
  const p = new THREE.PointLight(0xffd9b0, 18, 16, 1.6); p.position.set(0, 4.6, z); scene.add(p); houseLights.push(p);
}

const camera = new THREE.PerspectiveCamera(70, 1, 0.15, 100);
camera.rotation.order = 'YXZ';

/* ================= moving-head beams (same rig as the earlier viewer) ================= */
const beamMat = (color) => new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color(color) }, uStrength: { value: 0.32 } },
  vertexShader: '#include <common>\n#include <logdepthbuf_pars_vertex>\nvarying float vY; void main(){ vY = uv.y; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);\n#include <logdepthbuf_vertex>\n}',
  fragmentShader: '#include <logdepthbuf_pars_fragment>\nuniform vec3 uColor; uniform float uStrength; varying float vY; void main(){\n#include <logdepthbuf_fragment>\nfloat a = pow(vY, 1.6)*uStrength; gl_FragColor = vec4(uColor*a, a); }',
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});
const movers = [];
function addMover(pos, aim, color, phase, sweep, intensity = 55, len = 7) {
  const light = new THREE.SpotLight(color, intensity, 0, 0.16, 0.5, 2);
  light.position.set(...pos);
  scene.add(light, light.target);
  const geo = new THREE.ConeGeometry(Math.tan(0.16) * len, len, 32, 1, true);
  geo.translate(0, -len / 2, 0);
  const cone = new THREE.Mesh(geo, beamMat(color));
  cone.position.set(...pos);
  scene.add(cone);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 0.22, 16), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: .6, roughness: .4 }));
  head.position.set(pos[0], pos[1] + 0.12, pos[2]);
  scene.add(head);
  movers.push({ light, cone, intensity, base: new THREE.Vector3(...aim), phase, sweep });
}
addMover([-4.2, 5.4, 0.5], [-1.5, 1.2, -2.8], 0xff4fa3, 0.0, [2.6, 0.8]);
addMover([-1.4, 5.4, 0.8], [1.0, 1.0, -2.8], 0xf45120, 1.3, [2.2, 0.6]);
addMover([1.4, 5.4, 0.8], [-1.0, 1.0, -2.8], 0x6fd9ff, 2.6, [2.2, 0.6]);
addMover([4.2, 5.4, 0.5], [1.5, 1.2, -2.8], 0x9b6bff, 3.9, [2.6, 0.8]);
addMover([3.0, 5.4, 22.6], [6.1, 0.6, 27.0], 0xffb3d9, 0.7, [1.6, 0.5], 25, 7.2);
addMover([7.6, 5.4, 20.6], [8.4, 0.6, 25.0], 0xffd7a0, 2.1, [1.6, 0.5], 25, 7.2);

/* ================= character (rigged mannequin, idle / walk / run) ================= */
const avatar = new THREE.Group();
scene.add(avatar);
let mixer = null; const acts = {}; let curAct = null;

    avatar.rotation.y = bodyYaw;

    // camera
    eye.set(player.x, feetY + 1.62, player.z);
    camDir.set(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
    if (viewMode === 0) {
      camera.position.copy(eye); camera.rotation.set(pitch, yaw, 0); avatar.visible = false;
    } else {
      avatar.visible = true;
      const sign = viewMode === 1 ? -1 : 1; const want = 3.8;
      const pivot = tv.copy(eye); pivot.y += 0.35;
      const dir = camDir.clone().multiplyScalar(sign);
      ray.set(pivot, dir); ray.far = want;
      const hit = ray.intersectObject(collider)[0];
      const target = hit ? Math.max(0.5, hit.distance - 0.3) : want;
      // pull in fast when something blocks, ease back out slowly: no popping
      camDist = target < camDist ? target : camDist + (target - camDist) * Math.min(1, dt * 2.5);
      camera.position.copy(pivot).addScaledVector(dir, camDist);
      camera.lookAt(pivot);
    }
    crosshair.hidden = !(started && intro.hidden && viewMode === 0);
  } else {
    // idle orbit while loading
    camera.position.set(Math.sin(time * 0.1) * 10, 4, 16 + Math.cos(time * 0.1) * 10); camera.lookAt(0, 1.5, 8);
  }

  const sp = reduce ? 0 : 1;
  for (const mv of movers) {
    tv.copy(mv.base);
    tv.x += Math.sin(time * 0.55 * sp + mv.phase) * mv.sweep[0];
    tv.z += Math.cos(time * 0.41 * sp + mv.phase) * mv.sweep[1];
    mv.light.target.position.copy(tv);
    tv2.copy(tv).sub(mv.cone.position).normalize();
    mv.cone.quaternion.setFromUnitVectors(DOWN, tv2);
  }
  for (const p of pulsing) {
    const k = state.blink && !reduce ? (p.fast ? 0.8 + 0.2 * Math.sin(time * 2.4 + p.ph) : 0.93 + 0.07 * Math.sin(time * 0.7 + p.ph)) : 1;
    p.m.emissiveIntensity = p.base * k * (state.night ? 1 : 0.6);
  }
  mpUpdate(dt, now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
